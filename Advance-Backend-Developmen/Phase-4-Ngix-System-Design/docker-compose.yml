
services:
  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3

  server1:
    build: ./server
    # jo ./server folder k andar file thi , voh default run ho rahi thi 3000 port from the env file .
    # ussi ki port mapping kra di . 5000 k sath .
    # FIX: format "HOST:CONTAINER" hota h. container ke andar app 3000 pe h, host pe 5001 se khulega
    env_file:
      - ./server/.env
    environment:
      -  SERVER_NAME:"Pehla Server "
    ports:
      - "5001:3000"

  server2:
    build: ./server
    # jo ./server folder k andar file thi , voh default run ho rahi thi 3000 port from the env file .
    # ussi ki port mapping kra di . 5000 k sath .
    # FIX: format "HOST:CONTAINER" hota h. container ke andar app 3000 pe h, host pe 5002 se khulega
    env_file:
      - ./server/.env
    environment:
      -  SERVER_NAME:"Dusra Server "
    ports:
      - "5002:3000"

  server3:
    build: ./server
    # jo ./server folder k andar file thi , voh default run ho rahi thi 3000 port from the env file .
    # ussi ki port mapping kra di . 5000 k sath .
    # FIX: format "HOST:CONTAINER" hota h. container ke andar app 3000 pe h, host pe 5003 se khulega
    env_file:
      - ./server/.env
    environment:
      -  SERVER_NAME:"Teesra Server "
    ports:
      - "5003:3000"

