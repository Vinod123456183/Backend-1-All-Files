
events {

}

http {

    upstream backend {
        server server1:3000;
        server server2:3000;
        server server3:3000;
    }

    server {
        listen 80;

        # yahan iss route pr usse dusre server pr bj do .
        location / {
            # return 200 "hello from vinod Singh";

            # as a load balancer
            # bec container se container baat ho rahi h , toh server ka naam aega.
            # FIX: container-to-container me host port (5000) kaam nahi karta, container ka andar wala port (3000) lagta h

            proxy_pass http://backend;
        }
    }
}
